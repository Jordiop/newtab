<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="styles/newtab.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=Oxanium:wght@200..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/clock.css">
</head>
<body>
    <div class="settings-btn" id="settings-btn">
        <i class="fas fa-cog"></i>
    </div>
    <div class="edit-layout-btn" id="edit-layout-btn">
        <i class="fas fa-th"></i>
    </div>

    <div class="container">
        <div class="clock-container grid-widget" data-widget-id="clock">
            <div class="clock analog-clock" id="analog-clock">
                <div class="wrap">
                    <span class="hour"></span>
                    <span class="minute"></span>
                    <span class="second"></span>
                    <span class="dot"></span>
                </div>
            </div>
            <div class="squared-clock digital-clock" id="digital-clock" style="display: none;">
                <div class="digital-time" id="digital-time">00:00:00</div>
                <div class="digital-date" id="digital-date">Monday, January 1, 2024</div>
            </div>
        </div>

        <section class="search-section grid-widget" data-widget-id="search">
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="search-input" data-i18n="searchPlaceholder" placeholder="Search the web...">
                    <button id="search-btn" class="search-btn">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </section>

        <div class="calendar-widget grid-widget" id="calendar-widget" data-widget-id="calendar"></div>
        <div class="todo-widget grid-widget" id="todo-widget" data-widget-id="todo"></div>

        <section class="bookmarks-section grid-widget" data-widget-id="bookmarks">
            <h2 data-i18n="bookmarks">Bookmarks</h2>
            <div class="bookmarks-grid" id="bookmarks-grid">
            </div>
        </section>
    </div>

    <div id="folder-popup-modal" class="modal">
        <div class="modal-content folder-popup-content">
            <span class="close folder-close">&times;</span>
            <h3 class="folder-popup-title">Folder Bookmarks</h3>
            <div class="folder-bookmarks-grid" id="folder-bookmarks-grid">
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content settings-modal-enhanced">
            <div class="settings-header">
                <h3 data-i18n="settings">Settings</h3>
                <span class="close">&times;</span>
            </div>

            <nav class="settings-tabs-nav">
                <button class="settings-tab-btn active" data-tab="appearance">
                    <i class="fas fa-palette"></i>
                    <span data-i18n="appearance">Appearance</span>
                </button>
                <button class="settings-tab-btn" data-tab="widgets">
                    <i class="fas fa-th-large"></i>
                    <span data-i18n="widgets">Widgets</span>
                </button>
                <button class="settings-tab-btn" data-tab="general">
                    <i class="fas fa-sliders-h"></i>
                    <span data-i18n="general">General</span>
                </button>
            </nav>

            <div class="settings-tab-body">

                <!-- Appearance -->
                <div class="settings-tab-panel active" data-panel="appearance">
                    <div class="form-group">
                        <label for="custom-wallpaper-input" data-i18n="customWallpaper">Custom Wallpaper</label>

                        <div class="wallpaper-tabs">
                            <button type="button" class="wallpaper-tab active" data-tab="upload" data-i18n="uploadImage">Upload Image</button>
                            <button type="button" class="wallpaper-tab" data-tab="url" data-i18n="urlImage">URL Image</button>
                        </div>

                        <div id="upload-wallpaper-content" class="wallpaper-content">
                            <div class="custom-wallpaper-container">
                                <input type="file" id="custom-wallpaper-input" accept="image/*" style="display: none;">
                                <button type="button" class="file-btn" id="choose-wallpaper-btn">
                                    <i class="fas fa-upload"></i>
                                    <span data-i18n="chooseImage">Choose Image</span>
                                </button>
                                <div class="upload-info">
                                    <small>Supports: JPEG, PNG, GIF, WebP, SVG • Max: 50MB</small>
                                </div>
                            </div>
                        </div>

                        <div id="url-wallpaper-content" class="wallpaper-content" style="display: none;">
                            <div class="url-wallpaper-container">
                                <div class="url-input-group">
                                    <input type="url" id="wallpaper-url-input" data-i18n="enterImageUrl" placeholder="Enter image URL...">
                                    <button type="button" class="url-btn" id="url-wallpaper-btn">
                                        <i class="fas fa-download"></i>
                                        <span data-i18n="loadFromUrl">Load from URL</span>
                                    </button>
                                </div>
                                <div class="url-info">
                                    <small>Examples: Unsplash, Pexels, or any direct image URL</small>
                                </div>
                            </div>
                        </div>

                        <div id="custom-wallpaper-preview" class="wallpaper-preview"></div>
                        <button type="button" class="remove-btn" style="display: none;" id="remove-wallpaper-btn">
                            <i class="fas fa-trash"></i>
                            <span data-i18n="removeCustomWallpaper">Remove Custom Wallpaper</span>
                        </button>
                    </div>
                </div>

                <!-- Widgets -->
                <div class="settings-tab-panel" data-panel="widgets">
                    <div class="widget-toggle-list">
                        <div class="widget-toggle-row">
                            <div class="widget-toggle-info">
                                <i class="fas fa-clock"></i>
                                <span class="widget-toggle-name" data-i18n="clock">Clock</span>
                            </div>
                            <label class="toggle-switch">
                                <input type="checkbox" id="clock-visible" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                        <div class="widget-toggle-row">
                            <div class="widget-toggle-info">
                                <i class="fas fa-calendar-days"></i>
                                <span class="widget-toggle-name" data-i18n="calendar">Calendar</span>
                            </div>
                            <label class="toggle-switch">
                                <input type="checkbox" id="calendar-visible" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                        <div class="widget-toggle-row">
                            <div class="widget-toggle-info">
                                <i class="fas fa-list-check"></i>
                                <span class="widget-toggle-name" data-i18n="todo">To-Do</span>
                            </div>
                            <label class="toggle-switch">
                                <input type="checkbox" id="todo-visible" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                        <div class="widget-toggle-row">
                            <div class="widget-toggle-info">
                                <i class="fas fa-bookmark"></i>
                                <span class="widget-toggle-name" data-i18n="bookmarks">Bookmarks</span>
                            </div>
                            <label class="toggle-switch">
                                <input type="checkbox" id="bookmarks-visible" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- General -->
                <div class="settings-tab-panel" data-panel="general">
                    <div class="form-group">
                        <label for="default-search-engine" data-i18n="defaultSearchEngine">Default Search Engine</label>
                        <select id="default-search-engine">
                            <option value="google">Google</option>
                            <option value="ecosia">Ecosia</option>
                            <option value="brave">Brave</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="clock-type" data-i18n="clockType">Clock Type</label>
                        <select id="clock-type">
                            <option value="analog">Analog Clock</option>
                            <option value="digital">Digital Clock</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="language" data-i18n="language">Language</label>
                        <select id="language">
                            <option value="en">English</option>
                            <option value="es">Español</option>
                            <option value="ca">Català</option>
                        </select>
                    </div>
                </div>

            </div>

            <div class="settings-actions">
                <button type="button" class="reset-btn" id="reset-settings-btn" data-i18n="resetToDefaults">Reset to Defaults</button>
                <button type="button" class="submit-btn" id="save-settings" data-i18n="saveSettings">Save Settings</button>
            </div>
        </div>
    </div>

    <script type="module" src="scripts/main.js"></script>
</body>
</html>
